<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5a2e" />
    <title>Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f3eddb; color: #1c2b20; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 26rem; margin: 1rem; padding: 1.5rem; background: #fff; border: 1px solid #d8cfb4; border-top: 4px solid #1f5a2e; border-radius: 6px; text-align: center; }
      h1 { margin: 0 0 .5rem; font-size: 1.25rem; color: #1f5a2e; }
      p { margin: 0 0 1rem; line-height: 1.5; }
      a { display: inline-block; padding: .6rem 1.4rem; color: #fff; background: #1f5a2e; border-radius: 4px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The school portal needs an internet connection so that marks, fees and notices are always up to date. Please check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
