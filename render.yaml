services:
  - type: web
    name: school-portal-api
    env: node
    # A permanent disk is only available on a paid instance. On the free plan every restart, redeploy and idle sleep wipes the database.
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    healthCheckPath: /api/auth/login
    # The database, its daily copies, uploaded files and the school logo all live on this disk (DATA_DIR below).
    disk:
      name: school-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      # Must be the same as the disk's mountPath above, or the portal writes to the temporary disk and the data is lost again.
      - key: DATA_DIR
        value: /var/data
      # Signs every log in. Render makes a private random one; without it anyone could forge an Administrator login.
      - key: JWT_SECRET
        generateValue: true
      # Optional emailed backups (see the README, "Emailed backups"). Add the values in the Render dashboard.
      - key: BACKUP_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Optional automatic text messages (see the README, "Text messages"). Add them in the Render dashboard.
      - key: SMS_WEBHOOK_URL
        sync: false
      - key: SMS_WEBHOOK_TOKEN
        sync: false
